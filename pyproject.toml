[project]
name = "trading-game"
version = "0.1.0"
description = "Binance USD-M research, paper signals, risk experiments and sanitized engineering records"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["requests>=2.32.5,<3"]

[project.optional-dependencies]
mongo = ["pymongo>=4.14,<5"]
dev = ["pytest>=8,<10", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
